<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#eff7fd">
  <meta name="description" content="2026 천안시 청년정책 — 원본 슬라이드와 함께 탐색하는 인터랙티브 웹 프레젠테이션">
  <meta property="og:title" content="2026 천안시 청년정책 | 웹 프레젠테이션">
  <meta property="og:description" content="청년의 오늘을 지원하고 천안의 내일을 키웁니다">
  <title>2026 천안시 청년정책 | Interactive Presentation</title>
  <link rel="preload" href="./assets/slide-1.png" as="image">
  <link rel="stylesheet" href="./styles.css">
  <script src="./script.js" defer></script>
</head>
<body>
  <a class="skip" href="#presentationStage">프레젠테이션으로 건너뛰기</a>
  <div class="app">
    <header class="topbar">
      <a class="brand" href="#slide-1" aria-label="천안시 청년정책, 첫 슬라이드로 이동">
        <span class="brand-mark" aria-hidden="true"><span></span><span></span><span></span></span>
        <span class="brand-copy"><strong>CHEONAN <em>YOUTH</em></strong><small>POLICY PRESENTATION · 2026</small></span>
      </a>
      <div class="header-actions">
        <button class="quiet-btn icon-label" id="overviewBtn" type="button" title="전체 슬라이드 보기 (G)">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1.3"/><rect x="14" y="3" width="7" height="7" rx="1.3"/><rect x="3" y="14" width="7" height="7" rx="1.3"/><rect x="14" y="14" width="7" height="7" rx="1.3"/></svg><span>전체 보기</span>
        </button>
        <button class="quiet-btn icon-label" id="fullscreenBtn" type="button" title="전체 화면 (F)">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3H4a1 1 0 0 0-1 1v4m13-5h4a1 1 0 0 1 1 1v4M3 16v4a1 1 0 0 0 1 1h4m13-5v4a1 1 0 0 1-1 1h-4"/></svg><span>전체 화면</span>
        </button>
        <button class="mode-btn" id="modeBtn" type="button" title="원본 슬라이드 / 읽기 모드 전환">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M7 9h10M7 13h7"/></svg>
          <span id="modeBtnLabel">읽기 모드</span>
        </button>
      </div>
    </header>

    <nav class="chapter-nav" aria-label="슬라이드 목차" id="chapterNav"></nav>

    <main class="presentation" id="presentationStage">
      <div class="presentation-topline">
        <div class="section-indicator"><span class="live-dot" aria-hidden="true"></span><span id="sectionName">INTRODUCTION</span></div>
        <div class="instructions"><span class="desktop-hint">← → 방향키 · 마우스 휠 · 카드 클릭</span><span class="mobile-hint">좌우로 밀어 슬라이드 이동</span></div>
      </div>

      <div class="deck-area" id="deckArea">
        <button class="side-arrow prev-arrow" id="edgePrev" type="button" aria-label="이전 슬라이드" title="이전 슬라이드">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m14 5-7 7 7 7"/></svg>
        </button>
        <div class="deck-frame" id="deckFrame">
          <div class="stage" id="stage" role="group" aria-roledescription="슬라이드" aria-label="프레젠테이션 슬라이드">
            <div class="original-stage" id="originalStage">
              <img id="slideImage" src="./assets/slide-1.png" alt="천안시 청년정책 표지 슬라이드" draggable="false">
              <div class="hotspot-layer" id="hotspotLayer" aria-label="슬라이드 요소 살펴보기"></div>
              <div class="detail-popover" id="detailPopover" hidden>
                <button class="popover-close" id="popoverClose" type="button" aria-label="설명 닫기">×</button>
                <span class="detail-eyebrow" id="detailEyebrow"></span>
                <strong id="detailTitle"></strong>
                <p id="detailText"></p>
                <small id="detailFoot"></small>
              </div>
            </div>
            <div class="read-stage" id="readStage" hidden aria-label="모바일 친화적 읽기 모드"></div>
          </div>
        </div>
        <button class="side-arrow next-arrow" id="edgeNext" type="button" aria-label="다음 슬라이드" title="다음 슬라이드">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m10 5 7 7-7 7"/></svg>
        </button>
      </div>

      <div class="deck-controls">
        <div class="slide-meta">
          <span class="slide-index" id="slideIndex">01 <small>/ 10</small></span>
          <span class="separator"></span>
          <span class="slide-name" id="slideName">표지</span>
        </div>
        <div class="progress-wrap" aria-label="프레젠테이션 진행률"><div class="progress-track"><div class="progress-fill" id="progressFill"></div></div></div>
        <div class="movement-controls">
          <button class="control-btn" id="prevBtn" type="button" aria-label="이전 슬라이드"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg></button>
          <button class="control-btn primary-control" id="nextBtn" type="button" aria-label="다음 슬라이드"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg></button>
        </div>
      </div>
      <div class="bottom-meta"><span>CHEONAN CITY · YOUTH POLICY 2026</span><button type="button" id="shareBtn">이 슬라이드 링크 복사 <span aria-hidden="true">↗</span></button></div>
    </main>
  </div>

  <div class="overview-modal" id="overviewModal" role="dialog" aria-modal="true" aria-labelledby="overviewTitle" hidden>
    <div class="overview-panel">
      <div class="overview-heading"><div><span class="mini-label">SLIDE LIBRARY</span><h2 id="overviewTitle">전체 슬라이드</h2><p>원하는 페이지를 선택해 바로 이동하세요.</p></div><button class="overview-close" id="overviewClose" type="button" aria-label="전체 보기 닫기">×</button></div>
      <div class="overview-grid" id="overviewGrid"></div>
      <div class="overview-hint">방향키로 이동 · G 전체 보기 · F 전체 화면 · Esc 닫기</div>
    </div>
  </div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
</body>
</html>
